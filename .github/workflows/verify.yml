name: Verify application and Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://api.openai.com/v1' }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.1-codex-mini' }}
      AGENT_PROTOCOL: ${{ vars.AGENT_PROTOCOL || 'chat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clear previous generated CI evidence
        run: node -e "const fs=require('fs');for(const p of ['evidence/docker-smoke.json','evidence/browser-verification.json','evidence/screenshots'])fs.rmSync(p,{recursive:true,force:true})"
      - name: Deterministic unit and integration tests
        run: npm test
      - name: Build the actual Docker image
        run: docker build --tag cloud-agent-workbench:verify .
      - name: Verify pinned real CLI
        run: docker run --rm cloud-agent-workbench:verify codex --version
      - name: Prepare offline browser fixture from verified prior results
        run: node demo/prepare-browser-data.mjs
      - name: Start application in Docker
        run: |
          docker create --name workbench --init -p 127.0.0.1:3210:3210 \
            -e AGENT_API_KEY -e AGENT_BASE_URL -e AGENT_MODEL -e AGENT_PROTOCOL \
            cloud-agent-workbench:verify
          docker cp work/browser-data/. workbench:/app/data/
          docker start workbench
          docker exec --user 0 workbench chown -R node:node /app/data
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3210/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3210/
      - name: Real Agent CLI in Docker smoke test (when secret configured)
        if: env.AGENT_API_KEY != '' && github.event_name == 'workflow_dispatch'
        run: node demo/docker-smoke.js
      - name: Browser interaction checks and screenshots
        run: |
          npm install --prefix /tmp/workbench-browser --no-save --no-package-lock playwright-core@1.56.1
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk; fi
          PLAYWRIGHT_MODULE=/tmp/workbench-browser/node_modules/playwright-core/index.mjs node demo/browser-check.mjs
      - name: Container logs
        if: always()
        run: docker logs workbench || true
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-verification
          path: |
            evidence/docker-smoke.json
            evidence/browser-verification.json
            evidence/screenshots/
          if-no-files-found: ignore
